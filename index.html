<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103f3b">
<title>Асық ату – Әріптер мергені</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="svgdefs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
<symbol id="mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
<symbol id="group" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2 19c0-6 14-6 14 0m0-14a3 3 0 0 1 0 6m2 3q4 1 4 5"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="aim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol>
<symbol id="mark" viewBox="0 0 48 48"><path d="m24 3 7 7-7 7-7-7zM24 45l-7-7 7-7 7 7zM3 24l7-7 7 7-7 7zM45 24l-7 7-7-7 7-7zM24 17l7 7-7 7-7-7z" fill="currentColor" stroke="none"/></symbol>
</defs></svg>
<header class="topbar">
 <div class="brand"><span class="brandmark"><svg><use href="#mark"/></svg></span><span>Асық ату</span></div>
 <div class="tools">
  <button id="audioButton" class="tool" aria-label="Дыбысты өшіру" title="Дыбыс"><svg><use href="#sound"/></svg></button>
  <button id="fullButton" class="tool" aria-label="Толық экран" title="Толық экран"><svg><use href="#expand"/></svg></button>
 </div>
</header>
<main id="lobby" class="screen lobby">
 <div class="introGrid">
  <section class="hero">
   <div class="topic"><span>1-сынып</span><i></i>Әә дыбысы және әрпі</div>
   <h1><small>Асық ату</small>Әріптер<br><em>мергені</em></h1>
   <div class="jewels" aria-hidden="true">
    <div class="halo"></div><img class="gem gem-blue" src="assets/blue.png" alt=""><img class="gem gem-green" src="assets/green.png" alt=""><img class="gem gem-red" src="assets/red.png" alt=""><img class="gem gem-yellow" src="assets/yellow.png" alt=""><img class="gem champion" src="assets/saka.png" alt=""><b class="glint g1">✦</b><b class="glint g2">✦</b><b class="glint g3">✧</b>
   </div>
   <img class="hosts" src="assets/hello.png" alt="Қазақы оюлы мектеп формасындағы оқушылар">
  </section>
  <form id="setup" class="panel setup">
   <div class="rule"><i></i><svg><use href="#mark"/></svg><i></i></div>
   <h2>Топтарды таңда</h2>
   <div class="groupChoice" role="group" aria-label="Топ саны">
   <button type="button" data-count="2" aria-pressed="true"><svg><use href="#group"/></svg>2 топ</button>
   <button type="button" data-count="3" aria-pressed="false"><svg><use href="#group"/></svg>3 топ</button></div>
   <div class="names">
   <label><span><b class="dot t0"></b>1-топ</span><input id="team0" maxlength="22" value="Алғырлар" placeholder="Алғырлар" autocomplete="off"></label>
   <label><span><b class="dot t1"></b>2-топ</span><input id="team1" maxlength="22" value="Тапқырлар" placeholder="Тапқырлар" autocomplete="off"></label>
   <label id="third" hidden><span><b class="dot t2"></b>3-топ</span><input id="team2" maxlength="22" value="Мергендер" placeholder="Мергендер" autocomplete="off"></label>
   </div>
   <button class="ornate" id="start" type="submit">Ойынды бастау</button>
   <div class="setupMeta">Әр топқа 10 сұрақ <span>◆</span> Әр дәл жауапқа 1 ұпай</div>
  </form>
 </div>
 <div class="ribbon"><svg><use href="#aim"/></svg><strong>Қалай ойнаймыз?</strong><span>Сақаны ұста</span><b>›</b><span>Артқа тарт</span><b>›</b><span>Көздеп босат</span></div>
</main>
<main id="play" class="screen play" hidden>
 <div class="gamehead"><div id="scores" class="scores"></div><div class="round"><span id="roundNumber"></span><div class="track"><i id="progress"></i></div></div></div>
 <h2 id="question"></h2>
 <div id="court"><div id="world"><canvas id="board" aria-label="Асық ату алаңы. Төменгі ортадағы алтын сақаны ұстап, нысанаға қарама-қарсы бағытқа тартып, босат."></canvas><div id="captions"></div></div></div>
 <div class="turnbar"><img id="coach" src="assets/ready.png" alt=""><div class="turntext"><b id="turnName"></b><span id="notice" role="status" aria-live="polite"></span></div><button class="ornate action" id="advance" hidden></button></div>
</main>
<main id="result" class="screen result" hidden><section class="panel resultPanel"><p class="resultKicker">Құттықтаймыз!</p><h2>Бүгінгі асық мергендері!</h2><img class="victoryKids" src="assets/winner.png" alt="Жеңіске қуанған оқушылар"><div id="resultType"></div><h3 id="victor"></h3><div class="resultScores" id="resultScores"></div><div class="resultButtons"><button id="duel" class="secondary" hidden>Шешуші айналым</button><button id="restart" class="ornate">Қайта бастау</button></div></section><div id="confetti" aria-hidden="true"></div></main>
<script src="masks.js"></script><script src="game.js"></script>
</body>
</html>
